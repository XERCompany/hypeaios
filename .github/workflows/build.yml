name: build-hypeai-os
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm qemu-system-x86 xorriso make g++ python3
      - name: Build and test raw OS image
        run: make test
      - name: Build ISO artifact
        run: make iso
      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: hypeai-os-${{ github.sha }}
          path: |
            build/hypeai-os.img
            build/hypeai-os.iso
            build/version.txt
